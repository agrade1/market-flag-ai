name: 작업 (Task)
description: 커밋 컨벤션에 맞춘 작업 단위 이슈
title: "[type] 작업 제목"
labels: []
body:
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      description: 커밋 컨벤션과 동일한 타입을 선택하세요. (제목의 [type]도 이에 맞춰 수정)
      options:
        - feat (새로운 기능 추가)
        - fix (버그 수정)
        - chore (설정·패키지·빌드 관련 작업)
        - docs (문서 수정)
        - style (스타일 수정)
        - refactor (리팩토링)
        - test (테스트 코드 추가/수정)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 작업 요약
      description: 이 이슈에서 무엇을 하는지 한두 줄로 작성하세요.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 작업 내용
      description: 진행할 작업을 체크리스트로 작성하세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 (선택)
      description: 관련 링크, 브랜치명 등.
    validations:
      required: false
